# BloomNest web tier — serves the built React SPA and reverse-proxies
# /api and /uploads to the backend over the private compose network.
# The backend container is never published; this is the only public port.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # admin image uploads (5 MB server limit + header margin)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # hashed Vite assets are immutable — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API — path prefix preserved (backend mounts routers under /api)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # admin-uploaded product images
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — client-side routes like /orders/BN-... resolve here
    location / {
        try_files $uri $uri/ /index.html;
    }
}
